[package]
name = "uqview"
description = "uqview's window: the picture, zoom, the folder strip and Mark up (Qt Quick, themed by uQ)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "uqview"
path = "src/main.rs"

[dependencies]
uqview-core = { path = "../uqview-core" }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
libc = "0.2"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cxx-qt-build = "0.10"
