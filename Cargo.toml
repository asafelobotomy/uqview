[workspace]
resolver = "3"
members = ["crates/uqview-core", "crates/uqview"]
# The window needs Qt 6; the default build and tests don't.
default-members = ["crates/uqview-core"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.4"
license = "GPL-3.0-or-later"
repository = "https://github.com/asafelobotomy/uqview"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
